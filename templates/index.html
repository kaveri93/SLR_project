<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salary Prediction App</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      margin: 0;
      padding: 0;
    }
    header {
      background: #2d3436;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      padding: 30px;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #2d3436;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #74b9ff;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }
    input[type="number"]:focus {
      border-color: #0984e3;
      outline: none;
      box-shadow: 0 0 8px rgba(9,132,227,0.5);
    }
    button {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #5f27cd, #341f97);
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #6c5ce7;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
  </style>
</head>
<body>
  <header>Salary Prediction App</header>
  <div class="container">
    <form action="/predict" method="post">
      <label for="experience">Years of Experience:</label>
      <input type="number" step="0.1" id="experience" name="experience" placeholder="Enter years (e.g., 5.3)" required>
      <button type="submit">Predict Salary</button>
    </form>
    <div class="result">
      {{ prediction_text }}
    </div>
  </div>
</body>
</html>
